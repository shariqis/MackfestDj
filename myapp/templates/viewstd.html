<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Students List</h1>

    <table border="2px">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            {% for i in da %}

            <tr>
                <td>{{i.first_name}}</td>
                <td>{{i.my_email}}</td>
                <td>{{i.phone}}</td>
                <td>{{i.age}}</td>
                <td>
                    <a href="/del/{{ i.id }}">Delete</a>
                </td>
                <td>
                    <a href="/edit/{{ i.id }}">Edit</a>
                </td>
            </tr>

            {% endfor %}
        </tbody>
    </table>
</body>
</html>
